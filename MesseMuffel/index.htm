<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>MesseMuffel</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 15px 0 25px;
    }

    .controls label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      font-weight: bold;
      gap: 4px;
    }

    .controls input,
    .controls select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
    }

    ul#months {
      padding-left: 20px;
      margin: 0;
    }

    ul#months li {
      padding: 4px 0;
    }

    #suggestions h3 {
      margin: 18px 0 6px;
    }

    .week {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    .day {
      width: 52px;
      padding: 6px 0;
      border-radius: 8px;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.3;
      color: inherit;
      text-decoration: none;
    }

    .day .weekday {
      display: block;
      font-size: 0.7rem;
      opacity: 0.7;
    }

    .day .date {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main>
    <h1>MesseMuffel</h1>

    <h2>Messetermine finden</h2>

    <div class="controls">
      <label>Standort
        <input type="text" id="city" value="Köln">
      </label>
      <label>Monat
        <select id="month"></select>
      </label>
      <label>Jahr
        <select id="year"></select>
      </label>
    </div>

    <ul id="months">
      <li><a href="https://www.koelnmesse.de/aktuelle-termine/alle-messen/" target="_blank"
          rel="noopener">koelnmesse.de – Alle Messen</a></li>
    </ul>

    <h2>Terminvorschläge</h2>
    <div id="suggestions"></div>
  </main>

  <script>
    const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
      'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const DEFAULT_CITY = 'Köln';

    const cityInput = document.getElementById('city');
    const monthSelect = document.getElementById('month');
    const yearSelect = document.getElementById('year');
    const list = document.getElementById('months');
    let occupancy = null;

    function aumaUrl(year, month, city) {
      const params = new URLSearchParams({
        intFilterYearFrom: year,
        intFilterYearTo: year,
        intFilterMonthFrom: month,
        intFilterMonthTo: month,
        strLanguage: 'de',
        intSort: '1',
        intSeitenZahl: '1',
        strFilterCity: city
      });
      return 'https://www.auma.de/messen-finden/?' + params.toString();
    }

    function render() {
      const city = cityInput.value.trim() || DEFAULT_CITY;
      const startMonth = parseInt(monthSelect.value, 10);
      const startYear = parseInt(yearSelect.value, 10);

      list.querySelectorAll('li[data-month]').forEach(li => li.remove());
      for (let i = 0; i < 6; i++) {
        const date = new Date(startYear, startMonth - 1 + i, 1);
        const year = date.getFullYear();
        const month = date.getMonth() + 1;

        const a = document.createElement('a');
        a.href = aumaUrl(year, month, city);
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'AUMA Messen ' + MONTH_NAMES[month - 1] + ' ' + year;

        const li = document.createElement('li');
        li.dataset.month = month;
        li.appendChild(a);
        list.appendChild(li);
      }

      if (occupancy) renderSuggestions(occupancy);
    }

    // Selects befüllen; aktueller Monat im aktuellen Jahr ist vorselektiert.
    const now = new Date();
    MONTH_NAMES.forEach((name, index) => {
      const option = document.createElement('option');
      option.value = index + 1;
      option.textContent = name;
      monthSelect.appendChild(option);
    });
    monthSelect.value = now.getMonth() + 1;

    for (let year = now.getFullYear(); year <= now.getFullYear() + 3; year++) {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }
    yearSelect.value = now.getFullYear();

    cityInput.addEventListener('input', render);
    monthSelect.addEventListener('change', render);
    yearSelect.addEventListener('change', render);
    render();

    // Terminvorschläge: Belegungskarte aus data-processed.json
    const suggestions = document.getElementById('suggestions');
    const WEEKDAY_NAMES = ['Mo', 'Di', 'Mi', 'Do', 'Fr'];
    const LEVEL_COLORS = ['#63be7b', '#a9d08e', '#ffd966', '#f4b183', '#e06666'];

    function toIso(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function bookingUrl(day) {
      const checkin = new Date(day);
      checkin.setDate(checkin.getDate() - 1);
      const params = new URLSearchParams({
        ss: 'Im Mediapark 5',
        latitude: '50.9487485',
        longitude: '6.943942',
        checkin: toIso(checkin),
        checkout: toIso(day),
        group_adults: '1'
      });
      return 'https://www.booking.com/searchresults.de.html?' + params.toString();
    }

    function renderSuggestions(data) {
      suggestions.textContent = '';

      // Nur die 6 Monate ab dem im Formular gewählten Monat anzeigen.
      const start = new Date(parseInt(yearSelect.value, 10),
        parseInt(monthSelect.value, 10) - 1, 1);
      const end = new Date(start.getFullYear(), start.getMonth() + 6, 0);
      const filtered = {};
      for (const [iso, level] of Object.entries(data)) {
        const day = new Date(iso + 'T00:00:00');
        if (day >= start && day <= end) filtered[iso] = level;
      }

      const keys = Object.keys(filtered).sort();
      if (!keys.length) {
        suggestions.textContent = 'Keine Daten verfügbar.';
        return;
      }
      const present = new Set(keys);
      const first = new Date(keys[0] + 'T00:00:00');
      const last = new Date(keys[keys.length - 1] + 'T00:00:00');

      // Deutsche Kalenderwoche beginnt am Montag.
      const monday = new Date(first);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));

      let currentMonth = null;
      while (monday <= last) {
        const weekDays = [];
        for (let i = 0; i < 7; i++) {
          const day = new Date(monday);
          day.setDate(day.getDate() + i);
          weekDays.push(day);
        }
        // Nur vollständig in den Daten abgebildete Wochen verarbeiten.
        if (weekDays.every(day => present.has(toIso(day)))) {
          const monthKey = monday.getFullYear() * 12 + monday.getMonth();
          if (monthKey !== currentMonth) {
            currentMonth = monthKey;
            const heading = document.createElement('h3');
            heading.textContent = MONTH_NAMES[monday.getMonth()] + ' ' +
              monday.getFullYear();
            suggestions.appendChild(heading);
          }
          const week = document.createElement('div');
          week.className = 'week';
          for (let i = 0; i < 5; i++) { // Montag bis Freitag
            const iso = toIso(weekDays[i]);
            const box = document.createElement('a');
            box.className = 'day';
            box.href = bookingUrl(weekDays[i]);
            box.target = '_blank';
            box.rel = 'noopener';
            box.style.background = LEVEL_COLORS[filtered[iso]];
            box.title = iso;

            const weekday = document.createElement('span');
            weekday.className = 'weekday';
            weekday.textContent = WEEKDAY_NAMES[i];
            const date = document.createElement('span');
            date.className = 'date';
            date.textContent = weekDays[i].getDate();

            box.appendChild(weekday);
            box.appendChild(date);
            week.appendChild(box);
          }
          suggestions.appendChild(week);
        }
        monday.setDate(monday.getDate() + 7);
      }
    }

    fetch('data-processed.json')
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(data => {
        occupancy = data;
        renderSuggestions(occupancy);
      })
      .catch(() => {
        suggestions.textContent = 'Keine Daten verfügbar.';
      });
  </script>

</body>

</html>
